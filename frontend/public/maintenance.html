<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mise à jour en cours — HIS Archivage</title>
<style>
  :root {
    --navy-deep: #0A0F16;
    --navy: #1B365D;
    --navy-light: #274559;
    --gold: #FACC15;
    --text: #F3F5F8;
    --text-muted: #A8B6C8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, var(--navy-light) 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  /* Halo doré qui respire lentement en fond — discret, pas une animation criarde */
  .halo {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(250, 204, 21, 0.10) 0%, rgba(250, 204, 21, 0) 65%);
    animation: respirer 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes respirer {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  .carte {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    margin: 24px;
    padding: 44px 36px 36px;
    text-align: center;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 20px;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    animation: apparaitre 0.6s ease-out;
  }
  @keyframes apparaitre {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo-plaque {
    width: 72px;
    height: 72px;
    margin: 0 auto 22px;
    background: #fff;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  .logo-plaque img {
    width: 46px;
    height: 46px;
    object-fit: contain;
  }
  /* Anneau qui tourne autour de l'icône centrale : le geste "synchronisation
     en cours" le plus lisible, sans dépendre d'une police d'icônes externe
     (cette page doit fonctionner même quand tout le reste est en panne). */
  .anneau {
    position: relative;
    width: 64px;
    height: 64px;
    margin: 4px auto 24px;
  }
  .anneau svg {
    width: 100%;
    height: 100%;
    animation: tourner 1.4s linear infinite;
  }
  @keyframes tourner {
    to { transform: rotate(360deg); }
  }
  h1 {
    margin: 0 0 10px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: #fff;
  }
  p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text-muted);
  }
  .statut {
    margin-top: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .point {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: clignoter 1.4s ease-in-out infinite;
  }
  @keyframes clignoter {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
  .reessayer {
    display: none;
    margin-top: 22px;
    padding: 10px 22px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--navy-deep);
    background: var(--gold);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .reessayer:hover { filter: brightness(1.08); }
  footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11.5px;
    color: rgba(168, 182, 200, 0.55);
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="halo"></div>

  <div class="carte">
    <div class="logo-plaque">
      <img src="/logo192.png" alt="HIS" onerror="this.style.display='none'">
    </div>

    <div class="anneau">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="26" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>
        <path d="M32 6 A26 26 0 0 1 58 32" stroke="#FACC15" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Mise à jour en cours</h1>
    <p>HIS Archivage est en train de redémarrer.<br>Cette page se rafraîchira automatiquement dès que le site sera de retour.</p>

    <div class="statut">
      <span class="point" style="animation-delay:0s"></span>
      <span class="point" style="animation-delay:0.2s"></span>
      <span class="point" style="animation-delay:0.4s"></span>
      <span id="texteStatut">Nouvelle vérification dans quelques secondes...</span>
    </div>

    <button class="reessayer" id="btnReessayer" onclick="location.reload()">Réessayer maintenant</button>
  </div>

  <footer>Hetep Iaout Services — HIS Archivage</footer>

  <script>
    // Revérifie périodiquement si le serveur répond de nouveau, et recharge
    // automatiquement la page dès que c'est le cas — personne n'a à cliquer
    // sur "Réessayer" pour repartir. /api/ (la racine de l'API Laravel)
    // répond 200 dès que l'application a fini de redémarrer.
    var intervalleMs = 4000;
    var texteStatut = document.getElementById('texteStatut');
    var btnReessayer = document.getElementById('btnReessayer');
    var tentatives = 0;

    function verifier() {
      tentatives++;
      fetch(window.location.origin + '/api/', { cache: 'no-store' })
        .then(function (reponse) {
          if (reponse.ok) {
            texteStatut.textContent = 'Le site est de retour, rechargement...';
            setTimeout(function () { location.reload(); }, 500);
          }
        })
        .catch(function () { /* toujours indisponible, on retentera */ });

      // Après plusieurs échecs, propose un bouton manuel au cas où le
      // rafraîchissement automatique ne suffit pas (ex: cache du navigateur).
      if (tentatives >= 4) {
        btnReessayer.style.display = 'inline-block';
      }
    }

    verifier();
    setInterval(verifier, intervalleMs);
  </script>
</body>
</html>
